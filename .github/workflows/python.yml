name: Python Tests

on: [push, pull_request]


permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clear pip cache
        run: |
          pip cache purge

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug environment
        run: |
          python --version
          pip --version
          pip list

      - name: Run tests with retry
        run: |
          export JAVA_HOME=$JAVA_HOME
          RETRY_LIMIT=3
          COUNT=0
          pytest ./tests --alluredir=allure-results --disable-warnings || FAILED=true
          
          while [ $COUNT -lt $RETRY_LIMIT ] && [ "$FAILED" = "true" ]; do
            echo "Retrying failed tests... ($((COUNT+1))/$RETRY_LIMIT)"
            sleep 5
            pytest --last-failed --alluredir=allure-results --disable-warnings && FAILED=false
            COUNT=$((COUNT+1))
          done

      - name: Run Coverage
        if: ${{ always() }}
        run: |
          python -m packages.notifier.bot

      - name: Archive allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.33.0/allure-2.33.0.tgz \
          && sudo tar -xzf allure-2.33.0.tgz -C /opt/ \
          && sudo ln -s /opt/allure-2.33.0/bin/allure /usr/bin/allure

      - name: Download allure results
        uses: actions/download-artifact@v4
      - run: allure generate -c allure-results -o _site

      - name: Store report
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    name: Publish report
    steps:
      - name: Download generated report
        uses: actions/download-artifact@v4

      - name: Upload allure report
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "https://artem-coders.github.io/dm_api_tests/"


